name: Update SERPRO Rainfall

on:
  schedule:
    - cron: "30 2 * * *" # 09:30 WIB daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rainfall:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update rainfall
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
        run: python scripts/update_rainfall.py

      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/climate/rainfall/rainfall_daily.csv
          git diff --cached --quiet || git commit -m "data: update CHIRPS rainfall"
          git push
