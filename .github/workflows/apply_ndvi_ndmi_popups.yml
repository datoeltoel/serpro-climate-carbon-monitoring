name: Apply NDVI NDMI Map Popups

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply NDVI and NDMI popup patch
        run: python scripts/apply_ndvi_ndmi_popups.py

      - name: Validate Streamlit page syntax
        run: python -m py_compile 'pages/2_🌿_Vegetation_Monitoring.py'

      - name: Commit and push patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply_ndvi_ndmi_popups.yml scripts/apply_ndvi_ndmi_popups.py
          git add 'pages/2_🌿_Vegetation_Monitoring.py'
          git commit -m 'feat: add NDVI and NDMI map popups'
          git push origin HEAD:main
