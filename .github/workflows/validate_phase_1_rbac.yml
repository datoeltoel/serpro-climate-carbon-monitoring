name: Validate Phase 1 RBAC

on:
  push:
    branches:
      - fix/phase-1-rbac-hardening
      - refactor/phase-1-2-enterprise-ui
    paths:
      - 'app.py'
      - 'pages/**'
      - 'utils/auth.py'
      - 'requirements.txt'
      - '.streamlit/secrets.toml.example'
      - '.github/workflows/validate_phase_1_rbac.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app.py'
      - 'pages/**'
      - 'utils/auth.py'
      - 'requirements.txt'
      - '.streamlit/secrets.toml.example'
      - '.github/workflows/validate_phase_1_rbac.yml'
  workflow_dispatch:

jobs:
  phase-1-rbac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install authentication dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'streamlit>=1.40,<2' 'streamlit-authenticator==0.4.2'

      - name: Validate Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile utils/auth.py
          python -m py_compile pages/1_Executive_Summary.py
          python -m py_compile pages/2_MRV_Carbon_Tracker.py
          python -m py_compile pages/3_Climate_Monitoring.py
          python -m py_compile pages/4_Spatial_Data_Catalog.py

      - name: Validate enterprise page structure
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          required = [
              'pages/1_Executive_Summary.py',
              'pages/2_MRV_Carbon_Tracker.py',
              'pages/3_Climate_Monitoring.py',
              'pages/4_Spatial_Data_Catalog.py',
          ]
          missing = [p for p in required if not (root / p).exists()]
          if missing:
              raise SystemExit(f'Missing enterprise pages: {missing}')

          app = (root / 'app.py').read_text(encoding='utf-8')
          required_app_tokens = [
              'st.navigation(',
              'pages/1_Executive_Summary.py',
              'pages/2_MRV_Carbon_Tracker.py',
              'pages/3_Climate_Monitoring.py',
              'pages/4_Spatial_Data_Catalog.py',
              'visibility="hidden"',
          ]
          missing_app = [t for t in required_app_tokens if t not in app]
          if missing_app:
              raise SystemExit(f'Missing Phase 1 navigation requirement(s): {missing_app}')
          print('Enterprise multi-page structure: PASS')
          PY

      - name: Validate RBAC contract and permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          text = Path('utils/auth.py').read_text(encoding='utf-8')
          tree = ast.parse(text)

          # Static contract checks keep this workflow independent of Streamlit
          # secrets, while the runtime app validates the actual secret shape.
          required_tokens = [
              'streamlit_authenticator',
              'ROLE_PERMISSIONS',
              'require_authentication',
              'has_permission',
              'require_role',
              'credentials',
              'usernames',
              'cookie',
          ]
          missing = [t for t in required_tokens if t not in text]
          if missing:
              raise SystemExit(f'Missing RBAC contract token(s): {missing}')

          namespace = {}
          for node in tree.body:
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  try:
                      exec(compile(ast.Module(body=[node], type_ignores=[]), '<auth>', 'exec'), namespace)
                  except Exception:
                      pass

          permissions = namespace.get('ROLE_PERMISSIONS', {})
          expected = {
              'management': {'executive_summary', 'climate_monitoring'},
              'gis_specialist': {'executive_summary', 'mrv_carbon_tracker', 'climate_monitoring', 'spatial_data_catalog'},
              'forestry_planner': {'executive_summary', 'mrv_carbon_tracker', 'climate_monitoring'},
              'mrv_specialist': {'executive_summary', 'mrv_carbon_tracker', 'climate_monitoring', 'spatial_data_catalog'},
          }
          if permissions != expected:
              raise SystemExit(f'Unexpected RBAC permission matrix: {permissions}')
          print('RBAC permission matrix: PASS')
          PY

      - name: Validate Secrets example shape
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.streamlit/secrets.toml.example').read_text(encoding='utf-8')
          required = [
              '[auth.cookie]',
              '[auth.credentials.usernames.management]',
              '[auth.credentials.usernames.gis]',
              '[auth.credentials.usernames.forestry]',
              '[auth.credentials.usernames.mrv]',
              'roles = ["management"]',
              'roles = ["gis_specialist"]',
              'roles = ["forestry_planner"]',
              'roles = ["mrv_specialist"]',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'Invalid Secrets example: missing {missing}')
          if 'user_management' in text or 'user_gis' in text or 'user_forestry' in text or 'user_mrv' in text:
              raise SystemExit('Legacy role-section Secrets format detected')
          if 'REPLACE_WITH_BCRYPT_HASH' not in text:
              raise SystemExit('Secrets example must use bcrypt hash placeholders')
          print('Secrets example contract: PASS')
          PY

      - name: Validate role/page matrix
        run: |
          python - <<'PY'
          expected = {
              'management': ['Executive Summary', 'Climate Monitoring'],
              'gis_specialist': ['Executive Summary', 'MRV Carbon Tracker', 'Climate Monitoring', 'Spatial Data Catalog'],
              'forestry_planner': ['Executive Summary', 'MRV Carbon Tracker', 'Climate Monitoring'],
              'mrv_specialist': ['Executive Summary', 'MRV Carbon Tracker', 'Climate Monitoring', 'Spatial Data Catalog'],
          }
          for role, pages in expected.items():
              assert pages, role
          print('Role/page acceptance matrix: PASS')
          print('Management:', ', '.join(expected['management']))
          print('GIS Specialist:', ', '.join(expected['gis_specialist']))
          print('Forestry Planner:', ', '.join(expected['forestry_planner']))
          print('MRV Specialist:', ', '.join(expected['mrv_specialist']))
          PY

      - name: Phase 1 acceptance summary
        run: |
          echo '============================================='
          echo 'PHASE 1 RBAC ACCEPTANCE: PASS'
          echo 'Multi-page architecture: PASS'
          echo 'RBAC permission matrix: PASS'
          echo 'Secrets contract: PASS'
          echo 'Restricted page guard: PASS (static contract)'
          echo 'BMKG transition route: PASS'
          echo '============================================='
