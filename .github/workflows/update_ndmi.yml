name: Update SERPRO NDMI

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *" # 10:20 WIB daily

permissions:
  contents: write

jobs:
  ndmi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update NDMI
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
        run: python scripts/update_ndmi.py

      - name: Commit NDMI data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/climate/vegetation/ndmi_daily.csv
          git diff --cached --quiet || git commit -m "data: update SERPRO NDMI"
          git push
