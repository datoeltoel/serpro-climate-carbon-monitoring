name: Build Integrated Climate Risk

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update SERPRO Fire Monitoring", "Update SERPRO NDMI", "Build Rainfall Anomaly", "Build SPI-3 and SPI-6"]
    types: [completed]

permissions:
  contents: write

jobs:
  risk:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: integrated-climate-risk-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build integrated risk
        run: python scripts/build_integrated_risk.py

      - name: Commit risk data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/climate/risk/climate_risk_v2.csv data/processed/climate/risk/climate_risk_v2_metadata.json
          git diff --cached --quiet || git commit -m "data: update integrated climate risk v2"
          git push origin main
