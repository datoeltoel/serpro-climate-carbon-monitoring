name: Update SERPRO Hotspot History

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1" # weekly, Monday 11:20 WIB

permissions:
  contents: write

concurrency:
  group: serpro-hotspot-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build hotspot history
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
        run: python scripts/update_hotspot_history.py

      - name: Commit hotspot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/climate/fire/hotspot_history_2017_2025.csv data/processed/climate/fire/hotspot_history_metadata.json
          if git diff --cached --quiet; then
            echo "No hotspot history changes."
            exit 0
          fi
          git commit -m "data: update SERPRO hotspot history"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
