name: Apply BMKG Climate Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q pages utils scripts

      - name: Run BMKG ingestion
        run: python scripts/update_bmkg_forecast.py

      - name: Validate BMKG forecast output
        run: python scripts/validate_bmkg_forecast.py

      - name: Build BMKG spatial forecast surface
        run: python scripts/build_bmkg_forecast_surface.py

      - name: Commit BMKG forecast outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/bmkg data/derived/climate
          if git diff --cached --quiet; then
            echo "No BMKG forecast changes to commit."
          else
            git commit -m "chore: update BMKG forecast data"
            git push
          fi
