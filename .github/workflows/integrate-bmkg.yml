name: Apply BMKG Climate Integration

on:
  push:
    paths:
      - 'utils/climate/bmkg.py'
      - 'utils/climate/bmkg_idw.py'
      - 'scripts/integrate_bmkg_climate.py'
      - 'scripts/validate_bmkg_idw.py'
      - 'data/static/boundaries/serpro_carbon_project_zone_web.geojson'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply integration
        run: python scripts/integrate_bmkg_climate.py
      - name: Validate BMKG five-village IDW surface
        run: python scripts/validate_bmkg_idw.py
      - name: Validate syntax
        run: python -m compileall -q pages utils scripts
      - name: Commit dashboard integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/1_🌧_Climate_Monitoring.py
          if git diff --cached --quiet; then
            echo 'No dashboard changes needed.'
          else
            git commit -m 'feat: integrate BMKG local weather into climate dashboard'
            git push
          fi
