name: Update SERPRO Spatial Vegetation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_vegetation_spatial.py"
      - ".github/workflows/update_vegetation_spatial.yml"
      - "data/static/project_boundary.kml.gz"
  schedule:
    - cron: "45 3 * * *" # 10:45 WIB daily

permissions:
  contents: write

concurrency:
  group: serpro-vegetation-spatial-main
  cancel-in-progress: false

jobs:
  spatial-vegetation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build spatial vegetation layer
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
        run: python scripts/update_vegetation_spatial.py

      - name: Commit spatial vegetation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/climate/vegetation/vegetation_spatial_latest.geojson
          git diff --cached --quiet || git commit -m "data: update spatial vegetation layer"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# Triggered to regenerate the spatial GeoJSON using WGS 84 / UTM 49S analysis and EPSG:4326 output.
