name: Update SERPRO Spatial Vegetation

on:
  workflow_dispatch:
    inputs:
      period_days:
        description: "Requested Sentinel-2 composite period"
        required: true
        default: "90"
        type: choice
        options:
          - "90"
          - "180"
          - "365"
  push:
    paths:
      - "scripts/update_vegetation_spatial.py"
      - "scripts/apply_vegetation_map_popup.py"
      - "pages/2_🌿_Vegetation_Monitoring.py"
      - ".github/workflows/update_vegetation_spatial.yml"
      - "requirements.txt"
      - "data/static/project_boundary.kml.gz"
      - "data/static/boundaries/**"
  schedule:
    - cron: "45 3 * * *" # 10:45 WIB daily

permissions:
  contents: write

concurrency:
  group: serpro-vegetation-spatial-main
  cancel-in-progress: true

jobs:
  apply-map-popup:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'add clickable vegetation web map popup') && hashFiles('scripts/apply_vegetation_map_popup.py') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply vegetation web map popup
        run: python scripts/apply_vegetation_map_popup.py

      - name: Validate Streamlit page syntax
        run: python -m py_compile 'pages/2_🌿_Vegetation_Monitoring.py'

      - name: Commit popup update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_vegetation_map_popup.py .github/workflows/apply_vegetation_map_popup.yml 2>/dev/null || true
          git add 'pages/2_🌿_Vegetation_Monitoring.py'
          if git diff --cached --quiet; then
            echo "No popup changes to commit."
            exit 0
          fi
          git commit -m "feat: add clickable vegetation web map popup"
          git push origin HEAD:main

  spatial-vegetation:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'add clickable vegetation web map popup')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync main before data generation
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build spatial vegetation layer
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
          SPATIAL_PERIOD_DAYS: ${{ inputs.period_days || '90' }}
        run: python scripts/update_vegetation_spatial.py

      - name: Validate generated spatial outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          geo = Path("data/processed/climate/vegetation/vegetation_spatial_latest.geojson")
          raster = Path("data/processed/climate/vegetation/vegetation_spatial_raster.json")
          data = json.loads(geo.read_text(encoding="utf-8"))
          features = data.get("features", [])
          if not features:
              raise SystemExit("Generated GeoJSON contains no features")
          rp = json.loads(raster.read_text(encoding="utf-8"))
          required = {"ndvi", "ndmi", "stress"}
          if rp.get("web_display_scale_m") != 100:
              raise SystemExit(f"Unexpected web display scale: {rp.get('web_display_scale_m')}")
          if rp.get("analysis_scale_m") != 10:
              raise SystemExit(f"Unexpected analysis scale: {rp.get('analysis_scale_m')}")
          if not required.issubset(set((rp.get("layers") or {}).keys())):
              raise SystemExit("Raster package is missing NDVI/NDMI/stress layers")
          print(f"Spatial outputs OK: overview_features={len(features)}, analysis=10m, web_raster=100m")
          PY

      - name: Commit and push spatial vegetation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/climate/vegetation/vegetation_spatial_latest.geojson data/processed/climate/vegetation/vegetation_spatial_raster.json
          if git diff --cached --quiet; then
            echo "No spatial vegetation data changes to commit."
            exit 0
          fi
          git commit -m "data: update spatial vegetation overview and 100m web raster"
          git push origin HEAD:main

# Native Sentinel-2 analysis remains 10 m.
# Spatial overview is retained as a 250 m GeoJSON summary.
# The interactive dashboard map uses a compact 100 m raster generated from the native 10 m surface.
# No 50 m/100 m polygon grid is retrieved from Earth Engine, avoiding the previous toList/getInfo timeout.
