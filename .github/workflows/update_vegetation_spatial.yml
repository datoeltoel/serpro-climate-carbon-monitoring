name: Update SERPRO Spatial Vegetation

on:
  workflow_dispatch:
    inputs:
      period_days:
        description: "Requested Sentinel-2 composite period"
        required: true
        default: "90"
        type: choice
        options:
          - "90"
          - "180"
          - "365"
  push:
    paths:
      - "scripts/update_vegetation_spatial.py"
      - ".github/workflows/update_vegetation_spatial.yml"
      - "requirements.txt"
      - "data/static/project_boundary.kml.gz"
      - "data/static/boundaries/**"
  schedule:
    - cron: "45 3 * * *" # 10:45 WIB daily

permissions:
  contents: write

concurrency:
  group: serpro-vegetation-spatial-main
  cancel-in-progress: true

jobs:
  spatial-vegetation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync main before data generation
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build spatial vegetation layer
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
          SPATIAL_PERIOD_DAYS: ${{ inputs.period_days || '90' }}
        run: python scripts/update_vegetation_spatial.py

      - name: Validate generated GeoJSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/processed/climate/vegetation/vegetation_spatial_latest.geojson")
          data = json.loads(p.read_text(encoding="utf-8"))
          features = data.get("features", [])
          if not features:
              raise SystemExit("Generated GeoJSON contains no features")
          print(f"GeoJSON validation OK: {len(features)} features")
          PY

      - name: Commit and push spatial vegetation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/climate/vegetation/vegetation_spatial_latest.geojson
          if git diff --cached --quiet; then
            echo "No spatial vegetation data changes to commit."
            exit 0
          fi
          git commit -m "data: update spatial vegetation layer"
          git push origin HEAD:main

# Spatial analysis: WGS 84 / UTM 49S (EPSG:32749), native Sentinel-2 analysis scale 10 m.
# Web GeoJSON output uses a 250 m display grid for performance while each cell value is
# calculated from the native 10 m analysis. The analytical boundary is the complete SERPRO Project Area.
# Retrieval uses bounded toList pages with retries instead of one large computeFeatures response.
# The complete Project Area is therefore preserved while the synchronous response size stays small.
