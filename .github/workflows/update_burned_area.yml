name: Update SERPRO Burned Area History

on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 5 1 *" # 11:10 WIB on Jan 5

permissions:
  contents: write

concurrency:
  group: serpro-burned-area-update
  cancel-in-progress: false

jobs:
  burned-area:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update burned area
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
        run: python scripts/update_burned_area.py

      - name: Commit burned area data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/climate/fire/burned_area_annual_2016_2025.csv data/processed/climate/fire/burned_area_metadata.json
          if git diff --cached --quiet; then
            echo "No burned-area data changes."
            exit 0
          fi
          git commit -m "data: update SERPRO 10-year burned area"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
