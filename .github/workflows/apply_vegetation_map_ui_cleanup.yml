name: Apply Vegetation Map UI Cleanup

on:
  push:
    paths:
      - scripts/apply_vegetation_map_ui_cleanup.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply UI cleanup
        run: python scripts/apply_vegetation_map_ui_cleanup.py

      - name: Validate Streamlit page syntax
        run: python -m py_compile 'pages/2_🌿_Vegetation_Monitoring.py'

      - name: Commit cleanup and remove patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'pages/2_🌿_Vegetation_Monitoring.py'
          git rm scripts/apply_vegetation_map_ui_cleanup.py .github/workflows/apply_vegetation_map_ui_cleanup.yml
          git commit -m 'fix: clean vegetation map popup and legend layout'
          git push origin HEAD:main
